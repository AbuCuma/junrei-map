name: build

# 目的:让外部 PR 能被自动校验,并在打 tag 时产出签名 APK 发到 GitHub Release。
#
# check 作业刻意不使用任何 secret:MAPS_API_KEY 留空即可编译(地图会是空白的,其余功能与全部单测
# 都不受影响),这样 fork 发来的 PR 也能跑完整套检查。
# release 作业只在 `v*` tag 上跑,用仓库 Secrets 里的 Maps key 与签名 keystore(见 docs/development.md)。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 构建脚本会读 local.properties 取 MAPS_API_KEY / CUTOUT_MANIFEST_URL,
      # 两个键都有缺省降级路径,给空值即可。
      # **不要** cp local.properties.example —— 它里面的 sdk.dir 占位路径会让构建直接失败;
      # runner 上的 SDK 位置由 ANDROID_HOME 提供。
      - name: Create local.properties
        run: printf 'MAPS_API_KEY=\nCUTOUT_MANIFEST_URL=\n' > local.properties

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  release:
    # 打 tag 时构建签名的 release APK(R8 + 资源收缩)并创建 GitHub Release。
    # 需要的 Secrets:MAPS_API_KEY、RELEASE_KEYSTORE_BASE64、RELEASE_STORE_PASSWORD、
    # RELEASE_KEY_ALIAS、RELEASE_KEY_PASSWORD。缺 keystore 时 Gradle 会产出未签名包,下面的校验会拦下来。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          {
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY"
            printf 'CUTOUT_MANIFEST_URL=\n'
            printf 'RELEASE_STORE_FILE=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
          } > local.properties

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature and package
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "release APK is unsigned (RELEASE_* secrets incomplete?)"; ls app/build/outputs/apk/release; exit 1; }
          SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          echo "using $APKSIGNER"
          # verify 本身失败(未签名 / 签名损坏)就会以非零退出;证书行只打印,不拿它当判据。
          "$APKSIGNER" verify --print-certs "$APK" | grep -iE 'certificate (DN|SHA-256)' || true
          VERSION=${GITHUB_REF_NAME#v}
          OUT="junrei-map-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "巡礼地图 / Junrei Map ${GITHUB_REF_NAME}"
            echo
            echo "- Android 10 (API 29) 及以上 / or newer, Google Play services required"
            echo "- Package: io.github.abucuma.junreimap"
            echo
            echo '```'
            cat "$OUT.sha256"
            echo '```'
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "$OUT" "$OUT.sha256" \
            --title "Junrei Map ${GITHUB_REF_NAME}" --notes-file release-notes.md
